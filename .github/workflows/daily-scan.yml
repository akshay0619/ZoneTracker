name: Daily scan

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST (13:30 UTC), Monday-Friday, after NSE publishes its index file
  workflow_dispatch:           # "Run workflow" button for manual runs

permissions:
  contents: write              # commit the refreshed data back to the repo

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Tests
        run: python -m pytest -q

      - name: Update data and scan
        env:
          TZ: Asia/Kolkata         # "today" and the before-close check use Indian time
        run: python scripts/run_daily.py

      - name: Commit results
        run: |
          git config user.name "zone-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily scan $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
